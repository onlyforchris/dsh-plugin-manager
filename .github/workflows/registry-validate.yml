name: registry-validate

on:
  push:
    paths:
      - "registry/**"
      - "scripts/validate-registry.mjs"
  pull_request:
    paths:
      - "registry/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate registry
        run: node scripts/validate-registry.mjs
